name: "[TEST] Vault Connection Only"

on:
  workflow_dispatch:

jobs:
  test-connection:
    runs-on: ubuntu-latest
    steps:
    - name: Test Vault connection
      run: |
        echo "Testing connection to: ${{ secrets.VAULT_ADDR }}"
        echo "URL being tested: ${{ secrets.VAULT_ADDR }}/v1/sys/health"
        
        # Try different curl options
        curl -v ${{ secrets.VAULT_ADDR }}/v1/sys/health || echo "Curl failed"
        
        # Alternative with wget
        wget -O- ${{ secrets.VAULT_ADDR }}/v1/sys/health || echo "Wget failed"
        
        # Simple HTTP test
        echo "=== HTTP TEST ==="
        if curl -s -f ${{ secrets.VAULT_ADDR }}/v1/sys/health > /dev/null; then
          echo "✅ SUCCESS: Vault is reachable"
        else
          echo "❌ FAILED: Cannot reach Vault"
          echo "Please check:"
          echo "1. Vault server running locally on port 8200"
          echo "2. Tunnel is active and accessible"
          echo "3. GitHub Secret VAULT_ADDR is: ${{ secrets.VAULT_ADDR }}"
          exit 1
        fi
