name: Vault Integration Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  VAULT_ADDR: "http://localhost:8200"

jobs:
  test-vault-connection:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Vault
      run: |
        # Download and extract Vault
        Invoke-WebRequest -Uri "https://releases.hashicorp.com/vault/1.21.0/vault_1.21.0_windows_amd64.zip" -OutFile "vault.zip"
        Expand-Archive -Path "vault.zip" -DestinationPath "." -Force
        .\vault.exe version
        
    - name: Start Vault Dev Server
      run: |
        Start-Process -FilePath ".\vault.exe" -ArgumentList "server -dev -dev-listen-address=`"0.0.0.0:8200`"" -NoNewWindow
        timeout /t 5
        
    - name: Test Local Vault Connection
      run: |
        $env:VAULT_ADDR="http://localhost:8200"
        .\vault.exe status
        curl http://localhost:8200/v1/sys/health
        echo "Vault is running locally on port 8200"
