name: Vault Integration Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  test-vault-connection:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Vault
      run: |
        # Download and extract Vault
        Invoke-WebRequest -Uri "https://releases.hashicorp.com/vault/1.21.0/vault_1.21.0_windows_amd64.zip" -OutFile "vault.zip"
        Expand-Archive -Path "vault.zip" -DestinationPath "." -Force
        
    - name: Start Vault in Background
      id: start-vault
      run: |
        # Start Vault as a background process
        Start-Process -FilePath ".\vault.exe" -ArgumentList "server -dev -dev-listen-address=127.0.0.1:8200 -dev-root-token-id=testroottoken" -WindowStyle Hidden -PassThru
        echo "Vault process started in background"
        
        # Wait for Vault to be ready
        $maxRetries = 30
        $retryCount = 0
        $connected = $false
        
        while ($retryCount -lt $maxRetries -and -not $connected) {
            try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8200/v1/sys/health" -ErrorAction SilentlyContinue
                if ($response.StatusCode -eq 200) {
                    $connected = $true
                    echo "✅ Vault is ready!"
                    break
                }
            } catch {
                echo "Waiting for Vault to start... ($($retryCount + 1)/$maxRetries)"
                Start-Sleep -Seconds 1
                $retryCount++
            }
        }
        
        if (-not $connected) {
            echo "❌ Vault failed to start within $maxRetries seconds"
            exit 1
        }
        
    - name: Test Vault Operations
      run: |
        $env:VAULT_ADDR="http://127.0.0.1:8200"
        $env:VAULT_TOKEN="testroottoken"
        
        echo "Testing Vault connection..."
        .\vault.exe status
        
        echo "Writing test secret..."
        .\vault.exe kv put secret/hello foo=world
        
        echo "Reading test secret..."
        .\vault.exe kv get secret/hello
        
        echo "Listing secrets engines..."
        .\vault.exe secrets list
        
        echo "✅ All Vault operations completed successfully!"
        
    - name: Stop Vault
      if: always()
      run: |
        # Stop any running Vault processes
        Get-Process -Name "vault" -ErrorAction SilentlyContinue | Stop-Process -Force
        echo "Vault processes stopped"
