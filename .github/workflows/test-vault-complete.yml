name: "[TEST] Vault Integration - SAFE MODE"

on:
  workflow_dispatch:  # Manual trigger only - won't run on push/pull

env:
  IMAGE: srikanthawsos/gitops-node-argocd
  TEST_TAG: vault-test-$(date +%s)  # Unique tag to avoid conflicts

jobs:
  vault-integration-test:
    runs-on: ubuntu-latest
    environment: test  # Optional: use separate environment
    
    steps:
    # 1. Checkout code
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Setup Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3. CORE TEST: Retrieve secrets from Vault
    - name: Retrieve secrets from Vault
      id: vault
      uses: hashicorp/vault-action@v3
      with:
        url: ${{ secrets.VAULT_ADDR }}
        token: ${{ secrets.VAULT_TOKEN }}
        secrets: |
          secret/data/github-actions/docker DOCKERHUB_USERNAME | DOCKER_USERNAME ;
          secret/data/github-actions/docker DOCKER_PASSWORD | DOCKER_PASSWORD ;

    # 4. TEST 1: Verify Vault secret retrieval
    - name: Verify Vault secrets
      run: |
        echo "=== TEST 1: VAULT SECRET RETRIEVAL ==="
        if [ -n "${{ steps.vault.outputs.DOCKER_USERNAME }}" ] && [ -n "${{ steps.vault.outputs.DOCKER_PASSWORD }}" ]; then
          echo "✅ SUCCESS: Secrets retrieved from Vault"
          echo "Username: ${{ steps.vault.outputs.DOCKER_USERNAME }}"
          echo "Password: [hidden]"
        else
          echo "❌ FAILED: Could not retrieve secrets from Vault"
          exit 1
        fi

    # 5. TEST 2: Docker Hub authentication with Vault secrets
    - name: Test Docker Hub login
      run: |
        echo "=== TEST 2: DOCKER HUB AUTHENTICATION ==="
        echo "${{ steps.vault.outputs.DOCKER_PASSWORD }}" | docker login \
          -u "${{ steps.vault.outputs.DOCKER_USERNAME }}" \
          --password-stdin
        if [ $? -eq 0 ]; then
          echo "✅ SUCCESS: Docker Hub login using Vault secrets"
        else
          echo "❌ FAILED: Docker Hub authentication failed"
          exit 1
        fi

    # 6. TEST 3: Build Docker image (with unique tag)
    - name: Build Docker image for testing
      uses: docker/build-push-action@v4
      with:
        context: ./app
        load: true
        tags: ${{ env.IMAGE }}:${{ env.TEST_TAG }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # 7. TEST 4: Trivy security scan
    - name: Scan with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.IMAGE }}:${{ env.TEST_TAG }}
        format: table
        severity: CRITICAL,HIGH

    # 8. TEST 5: OPTIONAL - Push image (commented out for safety)
    - name: "[OPTIONAL] Push test image"
      if: false  # Disabled by default
      run: |
        echo "This step is disabled for safety"
        # docker push ${{ env.IMAGE }}:${{ env.TEST_TAG }}

    # 9. FINAL SUCCESS
    - name: Success report
      if: success()
      run: |
        echo ""
        echo "🎉🎉🎉 VAULT INTEGRATION TEST PASSED! 🎉🎉🎉"
        echo ""
        echo "✅ Vault Integration: WORKING"
        echo "✅ Docker Hub: WORKING"  
        echo "✅ Trivy Security: WORKING"
        echo ""
        echo "Your secrets are successfully retrieved from HashiCorp Vault!"
        echo ""
        echo "NOTE: Existing ci.yml workflow is untouched and still uses GitHub Secrets"

    # 10. Cleanup
    - name: Docker logout
      if: always()
      run: docker logout
